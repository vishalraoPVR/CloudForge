
name: CloudForge CI - Build, Test and Scan

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudforge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      # STEP 1: Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v6

      # STEP 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # STEP 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # STEP 4: Execute automated tests
      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v

      # STEP 5: Generate image name
      - name: Prepare Image Metadata
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # STEP 6: Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            --pull \
            -t "${{ steps.image.outputs.tag }}" \
            .

      # STEP 7: Security vulnerability scan
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      # STEP 8: Authenticate to registry
      # Only push events on main can publish images
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STEP 9: Publish immutable image
      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.image.outputs.tag }}"

      # STEP 10: Publish pipeline summary
      - name: Write Pipeline Summary
        if: success()
        run: |
          echo "## CloudForge CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker build: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trivy scan: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: ${{ steps.image.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
